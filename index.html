<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>対戦ボードゲーム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#151719;--panel:#222629;--panel2:#2b3034;--gold:#C5A66A;--silver:#AEB7BC;--lp:#5fcf7a;--op:#e0564a;--dp:#5b94e6;--sc:#e3c24a;--spc:#a97ae6;--danger:#6e1f1f;--text:#e6e2d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;font-size:14px}
h1,h2,h3,.serif{font-family:'Noto Serif JP',serif;color:var(--gold);letter-spacing:.04em}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:linear-gradient(#1c1f22,#151719);border-bottom:2px solid #3a3326;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:var(--panel);color:var(--silver);border:1px solid #3a4046;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:'Noto Serif JP',serif}
nav button.on{background:linear-gradient(#d6b878,#a88b4a);color:#1a1408;border-color:var(--gold);font-weight:700}
main{padding:16px 18px 40px;max-width:1400px;margin:0 auto}
button{font-family:inherit}
.btn{background:#3a4046;color:var(--text);border:1px solid #555d64;padding:7px 14px;border-radius:4px;cursor:pointer}
.btn:hover{background:#464e55}
.btn.main{background:linear-gradient(#d6b878,#a88b4a);color:#1a1408;border-color:var(--gold);font-weight:700}
.btn.danger{background:var(--danger);border-color:#8a2f2f}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:2px 8px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 14px}
select,input[type=text],input[type=search]{background:#1a1d20;color:var(--text);border:1px solid #444c52;border-radius:4px;padding:6px 8px;font-family:inherit}
.panel{background:var(--panel);border:1px solid #3a4046;border-radius:6px;padding:10px;margin-bottom:10px}
.note{color:#9aa3a8;font-size:12px}
.err{color:#ff8a7a}.warn{color:#e3c24a}.ok{color:#7fe09a}
/* card */
.card{width:190px;border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:4px;position:relative;font-size:11px;color:#eee;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .c-head{display:flex;justify-content:space-between;align-items:center;gap:4px;background:rgba(0,0,0,.45);padding:3px 6px;border-radius:4px}
.card .c-name{font-family:'Noto Serif JP',serif;font-weight:700;font-size:12px}
.card .c-rank{font-family:Roboto,sans-serif;font-size:10px;background:#000a;border-radius:8px;padding:1px 6px;color:var(--gold)}
.card .c-art{height:92px;border-radius:4px;overflow:hidden;border:1px solid #000a}
.card .c-art svg{width:100%;height:100%;display:block}
.card .c-type{font-size:10px;color:#cfd6da;background:rgba(0,0,0,.35);padding:1px 6px;border-radius:3px}
.card .c-text{font-size:10.5px;line-height:1.4;background:rgba(0,0,0,.28);padding:5px 6px;border-radius:4px;min-height:70px}
.card .c-text p{margin:0 0 4px}
.card .c-cond{border:1px solid var(--gold);border-radius:4px;padding:3px 5px;margin-bottom:4px;font-size:10px;background:#3a2f1a66}
.card .c-cond b{color:var(--gold)}
.card .c-stats{display:flex;gap:3px;flex-wrap:wrap}
.card.sm{zoom:.72}.card.sm .c-text{display:none}
.card.lg{zoom:1.75}
.rank1{background:linear-gradient(160deg,#3b4044,#23272a);border:3px solid #727a80;box-shadow:0 2px 6px #000a}
.rank2{background:linear-gradient(160deg,#4a5258,#2a3034);border:3px solid #cfd6da;box-shadow:0 0 0 1px #6c747a,0 0 10px #aeb7bc66}
.rank3{background:linear-gradient(160deg,#4d4128,#241d0e);border:3px solid #e0c070;box-shadow:0 0 0 1px #8a6f2e,0 0 16px #d9b84a99}
.k-tech .c-head{background:rgba(80,40,10,.6)}
.chip{font-family:Roboto,sans-serif;font-weight:700;font-size:10.5px;padding:1px 5px;border-radius:3px;background:#000a;border:1px solid #0006}
.chip.lp,.st-LP{color:var(--lp)}.chip.op,.st-OP{color:var(--op)}.chip.dp,.st-DP{color:var(--dp)}.chip.sc,.st-SC{color:var(--sc)}.chip.spc,.st-SpC{color:var(--spc)}.chip.cost{color:var(--spc)}
.grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.gcard{cursor:pointer;position:relative}
.gcard:hover{transform:translateY(-3px)}
.cnt{position:absolute;top:-6px;right:-6px;background:var(--gold);color:#1a1408;font-weight:700;border-radius:12px;min-width:24px;text-align:center;padding:2px 6px;z-index:2;font-family:Roboto}
/* builder */
.builder{display:grid;grid-template-columns:1fr 360px;gap:16px}
@media(max-width:900px){.builder{grid-template-columns:1fr}}
.drow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #333a40;cursor:default}
.drow .n{flex:1}.drow .r{font-size:10px;color:var(--gold)}
.sticky{position:sticky;top:64px}
/* board */
.battle{display:grid;grid-template-columns:auto 220px;gap:12px;align-items:start}
@media(max-width:1000px){.battle{grid-template-columns:1fr}}
.boardwrap{display:grid;grid-template-columns:auto minmax(0,1fr);width:max-content;max-width:100%}
.rowlabels,.collabels{display:grid;gap:2px;color:var(--gold);font-family:Roboto,sans-serif;font-weight:700;font-size:13px;text-align:center;align-items:center}
.rowlabels{grid-template-rows:repeat(7,1fr);padding:9px 4px 9px 0}
.collabels{grid-template-columns:repeat(7,1fr);padding:2px 9px 0}
.board{display:grid;width:max-content;grid-template-columns:repeat(7,84px);grid-template-rows:repeat(7,84px);gap:2px;background:#0c0d0e;padding:6px;border:3px solid #4a4030;border-radius:6px;background-image:radial-gradient(#1d2022,#101112)}
.cell{position:relative;background:linear-gradient(145deg,#4a4e52,#33373b);border:1px solid #1a1c1e;cursor:pointer;overflow:hidden;box-shadow:inset 0 0 8px #0008}
.cell.t-home{filter:none}.cell.t-border{background:linear-gradient(145deg,#5a5142,#3d372c)}.cell.t-enemy{background:linear-gradient(145deg,#52423f,#38292a)}
.cell.hl-move{outline:3px solid #4a90e8;outline-offset:-3px;box-shadow:inset 0 0 14px #4a90e8aa}
.cell.hl-attack{outline:3px solid #e24a3a;outline-offset:-3px;box-shadow:inset 0 0 14px #e24a3aaa}
.cell.hl-target{outline:3px solid #a97ae6;outline-offset:-3px;box-shadow:inset 0 0 14px #a97ae6aa}
.cell.hl-place{outline:3px solid #4a90e8;outline-offset:-3px}
.cell.hl-pay{outline:3px solid #e3c24a;outline-offset:-3px;box-shadow:inset 0 0 14px #e3c24aaa}
.cell.picked{outline:4px solid #fff;outline-offset:-4px}
.cell.hl-sel{outline:3px solid var(--gold);outline-offset:-3px}
.wall{position:absolute;inset:0;background:repeating-linear-gradient(0deg,#b89a62 0 14px,#8a6f3e 14px 16px);opacity:.85;display:flex;align-items:flex-end;justify-content:center;font-size:10px;color:#2a1c08}
.unit{position:absolute;inset:1px;border:2px solid #888;border-radius:4px;overflow:hidden;background:#111}
.unit.mine{border-color:#d9b84a}.unit.foe{border-color:#c0463a}
.unit .uart{position:absolute;inset:0}.unit .uart svg{width:100%;height:100%;display:block}
.unit .un{position:absolute;top:0;left:0;right:0;background:#000b;font-size:9px;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .us{position:absolute;bottom:0;left:0;right:0;background:#000c;display:flex;flex-wrap:wrap;gap:0 3px;padding:0 2px;font-family:Roboto;font-size:9px;font-weight:700;line-height:1.2}
.unit .stat{position:absolute;top:12px;right:1px;font-size:11px;text-shadow:0 0 3px #000}
.unit.hid{opacity:.7}.unit.fh{background:#2a2438;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold)}
.up{color:#ffb347!important;text-shadow:0 0 5px #ff9a2e}
.down{color:#ff7a7a!important}
.armor{color:#7fe3ff;text-shadow:0 0 5px #3ab}
.cell.acted .unit{filter:saturate(.5) brightness(.85)}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 4px;margin-top:10px;background:#1a1d20;border:1px solid #333a40;border-radius:6px;min-height:150px}
.hcard{cursor:pointer;flex:none;border-radius:10px;transition:transform .1s}
.hcard.sel{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold)}
.back{width:100px;height:140px;border-radius:8px;border:3px solid #6d7378;background:repeating-linear-gradient(45deg,#2a2438 0 8px,#1e1a2c 8px 16px);flex:none}
.log{max-height:170px;overflow:auto;font-size:10.5px;line-height:1.35}
.spcount{color:var(--gold)}
.log div{border-bottom:1px solid #30363b;padding:1px 0}
.pinfo{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.turnbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.badge{background:var(--panel2);padding:3px 10px;border-radius:12px;border:1px solid #444c52}
/* overlays */
#dlg,#modal,#cutin{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#000a}
#cutin{z-index:200;background:#000c;pointer-events:auto}
.dbox{background:var(--panel);border:2px solid var(--gold);border-radius:8px;padding:18px 22px;max-width:560px;box-shadow:0 8px 30px #000}
.dbox p{margin:0 0 14px;line-height:1.6}
.dbtn{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#000d;border:1px solid var(--gold);color:var(--text);padding:8px 16px;border-radius:6px;animation:fade 3s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
.cutcard{animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mbox{max-height:92vh;overflow:auto;padding:14px;background:var(--panel);border:2px solid var(--gold);border-radius:8px;max-width:96vw}
.mrow{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.kv{font-size:12px;line-height:1.7}
.kv b{color:var(--gold)}
.tag{display:inline-block;background:#3a2a4a;border:1px solid #6a4a8a;border-radius:10px;padding:0 8px;margin:1px;font-size:11px}
.tag.bad{background:#4a2a2a;border-color:#8a4a4a}

/* ===== スマホ対応：横スワイプを使わない ===== */
html{-webkit-text-size-adjust:100%}
.btn,.gcard,.hcard,.cell,nav button{touch-action:manipulation}
[data-card]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.mob-only{display:none}
@media(max-width:700px){
  .mob-only{display:block}.desk-only{display:none!important}
  header{position:static;padding:6px 8px;gap:6px}
  header h1{display:none}
  nav{width:100%;gap:4px;flex-wrap:nowrap}
  nav button{flex:1;padding:9px 2px;font-size:12px;min-height:40px;white-space:nowrap}
  main{padding:8px 8px 28px}
  h2{font-size:17px;margin:6px 0}
  .btn{min-height:40px;padding:8px 12px}.btn.sm{min-height:34px;min-width:36px}
  select,input[type=text],input[type=search]{min-height:40px;font-size:16px}
  .bar{margin:6px 0 8px}
  .grid{gap:8px;justify-content:flex-start}
  #grid .card.full{zoom:.86}
  .card.sm{zoom:.62}
  .hand .card.sm{zoom:.46}
  .card.lg{zoom:1.45}
  .builder{grid-template-columns:1fr}
  .sticky{position:static}
  .minibar{position:sticky;top:0;z-index:15;display:flex;gap:8px;align-items:center;justify-content:space-between;background:#101214ee;border:1px solid #3a4046;border-radius:6px;padding:6px 8px;margin:6px 0}
  .battle{grid-template-columns:1fr;gap:6px}
  .board{width:100%!important;grid-template-columns:repeat(7,minmax(0,1fr))!important;grid-template-rows:none!important;padding:3px;gap:1px}
  .cell{aspect-ratio:1/1}
  .unit{inset:0;border-width:1.5px}
  .unit .un{font-size:7px;padding:0 1px}
  .unit .us{font-size:7px;line-height:1.1;gap:0 2px}
  .unit .stat{font-size:9px;top:9px}
  .wall{font-size:8px}
  .turnbar{gap:5px;margin-bottom:6px}
  .badge{padding:2px 8px;font-size:12px}
  .turnbar .btn{padding:6px 8px;font-size:12px;min-height:38px}
  .hand{flex-wrap:wrap;overflow:visible;min-height:0;gap:5px;padding:6px 3px;margin-top:6px}
  .hcard{margin:0}
  .back{width:44px;height:62px}
  .dbox{max-width:94vw;padding:14px}
  .dbtn .btn{flex:1 1 100%}
  .mbox{max-width:98vw;padding:10px}
  .pkpanel{position:sticky;top:0;z-index:15}
  .log{max-height:none}
  .strip{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px}
}

@media(max-width:700px){
  .boardwrap{width:100%}
  .rowlabels{gap:1px;padding:6px 3px 6px 0;font-size:11px}
  .collabels{gap:1px;padding:1px 6px 0;font-size:11px}
}

/* サンダーストーム演出 */
.cell.th-roll{outline:3px solid #ffe14d;outline-offset:-3px;box-shadow:inset 0 0 16px #ffe14daa;filter:brightness(1.4)}
.cell.th-hit{background:linear-gradient(145deg,#fff6b0,#e8b820)!important;box-shadow:inset 0 0 22px #fffbe0;animation:thflash .3s ease-in-out 3}
@keyframes thflash{50%{filter:brightness(1.7)}}
</style></head>
<body>
<header><h1>⚔ 対戦ボードゲーム</h1><nav>
<button data-s="cards">① カード一覧</button><button data-s="builder">② デッキ構築</button><button data-s="prep">③ 対戦準備</button><button data-s="battle">④ 対戦</button></nav></header>
<main id="app"></main>
<div id="dlg"></div><div id="modal"></div><div id="cutin"></div><div id="toast"></div>
<script>'use strict';
/* ===== カードデータ ===== */
const CARDS = {};
const D = (id, o) => { CARDS[id] = Object.assign({ id, rank: 1, txt: [], ab: [] }, o); };
const CH = (id, o) => D(id, Object.assign({ kind: 'char' }, o));

CH('avatar', { name: 'アバター', kind: 'avatar', cat: 'アバター', race: '', lp: 2000, op: 0, dp: 0, sc: 1, spc: 1, txt: ['敗北条件に直結する盤上ユニット。バトルに負けたプレイヤーは敗北する。', 'どんなカードもアバターを対象にできない。'] });

CH('rookieAdv', { name: '駆け出し冒険者', cat: 'ヒューマノイド', race: 'ヒューム', lp: 3000, op: 0, dp: 0, sc: 1, spc: 0, weapon: true, txt: ['能力なし。武器を装備できる。'] });
CH('rookieMage', { name: '駆け出し魔法使い', cat: 'ヒューマノイド', race: 'ヒューム', lp: 2000, op: 0, dp: 0, sc: 1, spc: 1, weapon: true, ab: ['wizDice'], txt: ['配置時：サイコロを振り4以上でデッキからランダムにランク1のスペルを手札に加える。', '武器を装備できる。'] });
CH('normalGob', { name: 'ノーマルゴブリン', cat: 'モンスター', race: 'ゴブリン', lp: 1500, op: 0, dp: 0, sc: 2, spc: 0, weapon: true, ab: ['goblinSummon'], txt: ['手札に同ランクで種族ゴブリンのカードがあれば、追加で1体配置できる（追加配置の枠は消費しない。連鎖可）。', '武器を装備できる。'] });
CH('hobGob', { name: 'ホブゴブリン', cat: 'モンスター', race: 'ゴブリン', lp: 3000, op: 500, dp: 0, sc: 2, spc: 0, weapon: true, ab: ['hobCond'], txt: ['配置条件：デッキに種族ゴブリンのカードが9枚以上ないと場に出せない。', '武器を装備できる。'] });
CH('slime', { name: 'スライム', cat: 'モンスター', race: 'ウーズ', lp: 1000, op: 0, dp: 2000, sc: 1, spc: 1, ab: ['slime'], txt: ['バトル時（攻撃でも被攻撃でも）サイコロを振り、4以上なら相手の「武器」（上等な剣・上等な盾など）を戦闘前に破壊する。'] });
CH('vetAdv', { name: 'ベテラン冒険者', cat: 'ヒューマノイド', race: 'ヒューム', lp: 4000, op: 500, dp: 500, sc: 2, spc: 0, weapon: true, txt: ['デッキに「駆け出し」と名のつくヒューマノイドが3枚以上ないと、デッキに入れられない。', '武器を装備できる。'] });
CH('vetMage', { name: 'ベテラン魔法使い', cat: 'ヒューマノイド', race: 'ヒューム', lp: 2500, op: 0, dp: 1000, sc: 2, spc: 2, weapon: true, ab: ['wizDice'], txt: ['デッキに「駆け出し」と名のつくヒューマノイドが3枚以上ないと、デッキに入れられない。', '配置時：サイコロを振り4以上でデッキからランダムにランク1のスペルを手札に加える。', '武器を装備できる。'] });
CH('dwarf', { name: 'ドワーフの戦士', cat: 'ヒューマノイド', race: 'ドワーフ', rank: 2, lp: 4000, op: 0, dp: 1000, sc: 1, spc: 0, weapon: true, ab: ['dwarf'], txt: ['庇護：相手が自分のキャラクターを対象にアイテムを使用する際、ゲーム中に1度だけ、その対象をこのキャラクターに強制変更する。相手が相手自身のキャラクターを対象にする場合は発動しない。', '武器を装備できる。'] });
CH('gobWiz', { name: 'ゴブリンウィザード', cat: 'モンスター', race: 'ゴブリン', lp: 1500, op: 0, dp: 0, sc: 2, spc: 1, weapon: true, ab: ['wizDice'], txt: ['武器装備：このキャラクターは武器を装備できる。', '配置時：サイコロを振り4以上でデッキからランダムにランク1のスペルを手札に加える。', '（OP・DPは未指定のため暫定で0）'] });
CH('ogre', { name: 'オーガ', cat: 'モンスター', race: 'ジャイアント', rank: 2, lp: 5000, op: 0, dp: 0, sc: 2, spc: 2, weapon: true, ab: ['sacrifice'], txt: ['生贄：自分のキャラクターをLP合計1500以上になるよう破壊して配置。生贄のLP合計が4500以上なら2列目に配置してもよい。', '武器を装備できる。'] });
CH('redBoar', { name: 'レッドボア', cat: 'モンスター', race: 'ワイルド', rank: 2, lp: 4500, op: 500, dp: 0, sc: 4, spc: 1, ab: ['berserk'], txt: ['狂乱：1マスの代わりに必ず2マス動かなければならない。1ターンに一度、必ず移動しなければならない（SCが足りなければ不要）。移動に使うSCは通常より1つ増える。', '味方は通過できるが同じマスには停止できない。敵は飛び越せない。盤面端が移動先なら1マスで停止できる。'] });
CH('elfMage', { name: 'エルフの魔法使い', cat: 'ヒューマノイド', race: 'エルフ', rank: 2, lp: 2500, op: 0, dp: 2500, sc: 3, spc: 3, weapon: true, ab: ['magicResist', 'wizDice'], txt: ['魔法耐性：相手のスペルが自分に効果を及ぼす時、そのスペルの消費SpCより1多いSpCを支払って効果を打ち消せる（SC代用不可）。', '配置時：サイコロを振り4以上でデッキからランダムにランク1のスペルを手札に加える。', '武器を装備できる。'] });

const deckSize = l => Object.values(l).reduce((a, b) => a + b, 0);
function validateDeck(list) {
  const err = [], warn = [];
  const ids = Object.keys(list).filter(k => list[k] > 0);
  const n = deckSize(list);
  if (n !== 30) err.push(`デッキ枚数が${n}枚です（30枚必要）`);
  let r2 = 0, r3 = 0;
  for (const id of ids) {
    const c = CARDS[id], k = list[id];
    if (k > 3) err.push(`「${c.name}」が${k}枚（同名は最大3枚）`);
    if (c.rank === 2) { r2 += k; if (c.kind !== 'char' && k > 1) err.push(`ランク2の${KIND_LABEL[c.kind]}「${c.name}」は同名1枚まで`); }
    if (c.rank === 3) r3 += k;
  }
  if (r2 > 6) err.push(`ランク2が${r2}枚（合計6枚まで）`);
  if (r3 > 1) err.push(`ランク3が${r3}枚（合計1枚まで）`);
  const rookies = ids.filter(id => CARDS[id].name.startsWith('駆け出し') && CARDS[id].cat.includes('ヒューマノイド')).reduce((a, id) => a + list[id], 0);
  for (const id of ['vetAdv', 'vetMage']) if (list[id] > 0 && rookies < 3) err.push(`「${CARDS[id].name}」はデッキに「駆け出し」ヒューマノイドが3枚以上必要（現在${rookies}枚）`);
  const gob = ids.filter(id => CARDS[id].race === 'ゴブリン').reduce((a, id) => a + list[id], 0);
  if (list.hobGob > 0 && gob < 9) warn.push(`ホブゴブリンは種族ゴブリンが9枚以上ないと場に出せません（現在${gob}枚）`);
  const wild = ids.filter(id => CARDS[id].race === 'ワイルド' && CARDS[id].kind === 'char').reduce((a, id) => a + list[id], 0);
  if (list.killerTiger > 0 && wild < 10) warn.push(`キラータイガーは種族ワイルドのキャラが10体以上ないと配置できません（現在${wild}体）`);
  return { err, warn, r: [n - r2 - r3, r2, r3] };
}

const rnd = n => Math.floor(RNG() * n);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1);[a[i], a[j]] = [a[j], a[i]]; } return a; };
const fwd = o => (o === 0 ? -1 : 1);
const rowOf = (o, y) => (o === 0 ? 7 - y : y + 1);
const cellOfRow = (o, r, x) => ({ x, y: o === 0 ? 7 - r : r - 1 });
const inB = (x, y) => x >= 0 && x < 7 && y >= 0 && y < 7;
const U = () => Object.values(G.units);
const isAv = u => u.cid === 'avatar';
const own = i => U().filter(u => u.owner === i);
const chars = i => U().filter(u => u.owner === i && !isAv(u) && !u.hidden);
const allChars = () => U().filter(u => !isAv(u) && !u.hidden);
const at = (x, y) => U().find(u => u.x === x && u.y === y);
const enemyAt = (x, y, o) => { const t = at(x, y); return t && t.owner !== o && !t.hidden ? t : null; };
const wallAt = (x, y) => G.walls[x + ',' + y];
const cur = () => G.players[G.active];
const abC = (cid, k) => CARDS[cid].ab.includes(k);
const abU = (u, k) => abC(u.cid, k);
const nm = u => CARDS[u.cid].name;
const log = s => { G.log.unshift(s); if (G.log.length > 120) G.log.pop(); };
const terrOfRow = r => (r <= 3 ? 'home' : r === 4 ? 'border' : 'enemy');
const terr = u => terrOfRow(rowOf(u.owner, u.y));

function mkUnit(owner, cid, x, y) {
  const c = CARDS[cid];
  const u = { uid: UIDC++, owner, cid, x, y, lp: c.lp, sc: c.sc, spc: c.spc, acted: 0, placedAt: G.turn, weapon: null, armor: 0, gArmor: 0, tArmor: 0, attach: [], st: {}, lpPen: 0, scPen: 0, buffs: [], hidden: false, hiddenSince: 0, dpBonus: 0, uses: {}, dead: false };
  G.units[u.uid] = u;
  return u;
}
function newGame(d0, d1) {
  UIDC = 1;
  G = { turn: 0, active: 0, phase: 'start', over: null, units: {}, walls: {}, log: [], assault: null,
    players: [d0, d1].map((d, i) => ({ i, name: i ? '後攻' : '先行', deck: shuffle(d), deckList: [...d], hand: [], grave: [], count: 0, spellsUsed: 0, r1Spells: 0, summons: 0, extra: 0, goblinSlots: 0, parade: false, instinct: null, reshuffled: false, avatar: null })) };
  for (const p of G.players) {
    const c = cellOfRow(p.i, 1, 3);
    p.avatar = mkUnit(p.i, 'avatar', c.x, c.y).uid;
    draw(p, 4);
  }
  return G;
}
function draw(p, n = 1) {
  let k = 0;
  for (let i = 0; i < n; i++) {
    if (!p.deck.length) {
      if (!p.reshuffled && p.grave.length) { p.deck = shuffle(p.grave); p.grave = []; p.reshuffled = true; log(`${p.name}：墓地をシャッフルして山札にした`); }
      else break;
    }
    p.hand.push(p.deck.shift()); k++;
  }
  return k;
}

/* ステータス */
const isGobName = u => CARDS[u.cid].kind === 'char' && CARDS[u.cid].name.includes('ゴブリン');
const baseLP = u => CARDS[u.cid].lp + (isGobName(u) && G.players[u.owner].parade ? 1500 : 0) - u.lpPen;
const golemStep = u => (/^golem[123]$/.test(u.cid) ? +u.cid.slice(5) : 0);
const baseSC = u => CARDS[u.cid].sc - u.scPen;
const baseSpC = u => CARDS[u.cid].spc + (u.weapon && CARDS[u.weapon].wspc ? CARDS[u.weapon].wspc : 0);
function OP(u) { let v = CARDS[u.cid].op; if (u.weapon) v += CARDS[u.weapon].wop || 0; for (const a of u.attach) v += CARDS[a.cid].aop || 0; for (const b of u.buffs) if (b.k === 'op') v += b.amt; return v; }
function DP(u) { let v = CARDS[u.cid].dp + u.dpBonus; if (u.weapon) v += CARDS[u.weapon].wdp || 0; for (const b of u.buffs) if (b.k === 'dp') v += b.amt; return v; }
const aop = a => (a.cid === 'fightSpirit' ? 500 : 0);
CARDS.fightSpirit.aop = 500;
const armorTotal = u => u.armor + u.gArmor + u.tArmor;
const healPen = u => (u.st.burn ? 500 : 0) + (u.st.chill ? 500 : 0) + (u.st.frost ? 1000 : 0);
function heal(u, n) { n = Math.max(0, n - healPen(u)); const b = baseLP(u); if (u.lp < b) u.lp = Math.min(b, u.lp + n); }
function recomputePen(u) {
  const lp = (u.st.poison ? 500 : 0) + (u.st.venom ? 1500 : 0) + (u.st.frost ? 2000 : 0);
  const sc = (u.st.poison ? 1 : 0) + (u.st.venom ? 2 : 0);
  const dl = lp - u.lpPen, ds = sc - u.scPen;
  u.lpPen = lp; u.scPen = sc;
  if (ds > 0) u.sc = Math.max(0, u.sc - ds);
  if (dl > 0) { u.lp -= dl; if (u.lp <= 0) killUnit(u); }
}
function addStatus(u, k) {
  if (u.dead) return;
  const s = u.st;
  if (k === 'burn') s.burn = true;
  else if (k === 'chill') { if (s.frost) { /* 変化なし */ } else if (s.chill) { delete s.chill; s.frost = true; } else s.chill = true; }
  else if (k === 'poison') { if (s.venom) { /* 変化なし */ } else if (s.poison) { delete s.poison; s.venom = true; } else s.poison = true; }
  else if (k === 'petrify') s.petrify = G.players[u.owner].count + 1;
  log(`${nm(u)}が状態異常「${STATUS_NAME[statusKey(u, k)]}」になった`);
  recomputePen(u);
}
const STATUS_NAME = { burn: 'やけど', chill: 'しもやけ', frost: '凍傷', poison: '毒', venom: '猛毒', petrify: '石化' };
const statusKey = (u, k) => (k === 'chill' && u.st.frost ? 'frost' : k === 'poison' && u.st.venom ? 'venom' : k);
function statusList(u) { return Object.keys(u.st).filter(k => u.st[k] != null && u.st[k] !== false); }
function cure(u, k) {
  if (k === 'frost') { delete u.st.frost; u.st.chill = true; }
  else if (k === 'venom') { delete u.st.venom; u.st.poison = true; }
  else delete u.st[k];
  recomputePen(u);
  u.sc = Math.min(u.sc, baseSC(u));
}
function killUnit(u) {
  if (u.dead) return;
  u.dead = true;
  const p = G.players[u.owner];
  if (isAv(u)) { G.over = 1 - u.owner; log(`${p.name}のアバターが倒された`); }
  else { p.grave.push(u.cid); log(`${nm(u)}が破壊された`); }
  if (u.weapon) p.grave.push(u.weapon);
  for (const a of u.attach) p.grave.push(a.cid);
  delete G.units[u.uid];
}
function damage(u, n, opts) {
  if (u.dead || (u.hidden && !(opts && opts.hit)) || n <= 0) return;
  if (armorTotal(u) > 0) {
    let a = Math.min(u.tArmor, n); u.tArmor -= a; n -= a;
    a = Math.min(u.gArmor, n); u.gArmor -= a; n -= a;
    if (n > 0 && u.armor > 0) { a = Math.min(u.armor, n); u.armor -= a; n -= a; }
  }
  if (n <= 0) return;
  u.lp -= n;
  if (u.lp <= 0) { killUnit(u); return; }
  if (abU(u, 'superRegen')) heal(u, 1500); else if (abU(u, 'regen')) heal(u, 500);
}

/* ===== 移動 ===== */
const assaultOn = u => !!G.assault && G.assault.turn === G.turn && u.owner === G.assault.owner && !isAv(u) && CARDS[u.cid].race === G.assault.race;
const hasShift = u => u.attach.some(a => a.cid === 'shiftForm' && G.players[u.owner].count >= a.since);
const hasHunting = u => u.attach.some(a => a.cid === 'fightSpirit' && G.players[u.owner].count >= a.since);
function canActNow(u) {
  if (u.dead || u.hidden || G.over) return false;
  if (u.owner !== G.active) return false;
  if (u.st.petrify != null) return false;
  if (u.acted >= (abU(u, 'twoActions') && !assaultOn(u) ? 2 : 1)) return false;
  if (u.placedAt === G.turn && !isAv(u) && !abU(u, 'haste') && !assaultOn(u)) return false;
  return true;
}
function dirsFor(u, assault) {
  const dy = fwd(u.owner);
  let dirs = hasShift(u) ? [[-1, dy], [1, dy], [-1, -dy], [1, -dy]] : [[0, dy], [-1, 0], [1, 0], [0, -dy]];
  if (assault) dirs = dirs.filter(d => d[1] === dy);
  return dirs;
}
function evalCell(u, x, y) {
  if (!inB(x, y)) return 'out';
  if (wallAt(x, y) && !abU(u, 'flight')) return 'block';
  const t = at(x, y);
  if (!t) return 'empty';
  if (t.owner === u.owner) return 'ally';
  if (t.hidden) return 'block';
  return 'enemy';
}
function movesFor(u) {
  if (!canActNow(u)) return [];
  const o = u.owner, dy = fwd(o);
  const assault = assaultOn(u), bers = abU(u, 'berserk');
  const len = assault || bers ? 2 : 1;
  const out = [];
  for (const d of dirsFor(u, assault)) {
    const backPure = d[0] === 0 && d[1] === -dy;
    const noBattle = backPure && !abU(u, 'backBattle');
    const canHit = t => !noBattle && !(assault && isAv(t));
    const cells = [];
    for (let k = 1; k <= len; k++) cells.push([u.x + d[0] * k, u.y + d[1] * k]);
    const cost = () => (assault ? 0 : 1 + (bers ? 1 : 0)); // SCは「1回の移動」につき消費（マス数ではない）
    const push = (type, c, steps, path) => { const cs = cost(); if (assault || u.sc >= cs) out.push({ x: c[0], y: c[1], type, steps, cost: cs, path }); };
    if (len === 1) {
      const c = cells[0], r = evalCell(u, c[0], c[1]);
      if (r === 'empty') push('move', c, 1, [c]);
      else if (r === 'enemy' && canHit(at(c[0], c[1]))) push('attack', c, 1, [c]);
    } else {
      const a = cells[0], b = cells[1], ra = evalCell(u, a[0], a[1]);
      if (ra === 'enemy') { if (canHit(at(a[0], a[1]))) push('attack', a, 1, [a]); continue; }
      if (ra === 'empty' || ra === 'ally') {
        const rb = evalCell(u, b[0], b[1]);
        if (rb === 'empty') push('move', b, 2, [a, b]);
        else if (rb === 'enemy' && canHit(at(b[0], b[1]))) push('attack', b, 2, [a, b]);
        else if (rb === 'out' && ra === 'empty') push('move', a, 1, [a]);
      }
    }
  }
  return out;
}
function huntTargets(u) {
  if (u.dead || u.st.petrify != null) return [];
  const dy = fwd(u.owner), bers = abU(u, 'berserk');
  const cost = 1 + (bers ? 1 : 0);
  if (u.sc < cost) return [];
  const out = [];
  for (const d of dirsFor(u, false)) {
    const backPure = d[0] === 0 && d[1] === -dy;
    if (backPure && !abU(u, 'backBattle')) continue;
    const x = u.x + d[0], y = u.y + d[1];
    if (evalCell(u, x, y) === 'enemy') out.push({ x, y, cost });
  }
  return out;
}
const mustMove = u => (u.owner === G.active && (assaultOn(u) || (abU(u, 'berserk') && u.acted === 0)) && movesFor(u).length > 0);

async function slashTrigger(u) {
  const n = u.attach.filter(a => a.cid === 'windSlash').length;
  for (let k = 0; k < n; k++) {
    if (u.dead) return;
    const tg = chars(1 - u.owner);
    if (!tg.length) return;
    const r = await UI.pickBoard({ prompt: `ウインドスラッシュ${n > 1 ? `（${k + 1}/${n}）` : ''}：1000ダメージを与える相手キャラを選択`, cells: tg.map(t => [t.x, t.y]), kind: 'target', cancellable: false });
    const t = at(r[0][0], r[0][1]);
    if (!t) continue;
    if (await resist(t, 1, G.players[u.owner])) continue;
    log(`ウインドスラッシュ：${nm(t)}に1000ダメージ`);
    damage(t, 1000);
    UI.render();
  }
}
async function doMove(u, mv) {
  const from = { x: u.x, y: u.y };
  if (!assaultOn(u)) u.sc -= mv.cost;
  u.acted++;
  const o = u.owner;
  for (let i = 0; i < mv.path.length; i++) {
    const [x, y] = mv.path[i];
    const last = i === mv.path.length - 1;
    if (mv.type === 'attack' && last) {
      await slashTrigger(u);
      if (u.dead || G.over) return;
      const d = enemyAt(x, y, o);
      if (!d) { u.x = x; u.y = y; }
      else {
        const won = await battle(u, d);
        if (G.over || u.dead) return;
        if (won) { u.x = x; u.y = y; } else { u.x = from.x; u.y = from.y; return; }
      }
    } else {
      u.x = x; u.y = y;
      await slashTrigger(u);
      if (u.dead || G.over) return;
    }
  }
  log(`${nm(u)}が${coord(from.x, from.y)}から${coord(u.x, u.y)}へ移動`);
  await onEntered(u, from);
}
async function onEntered(u, from) {
  const p = G.players[u.owner];
  if (instinctActive(p) && terr(u) === 'enemy' && !(from && terrOfRow(rowOf(u.owner, from.y)) === 'enemy')) { u.lp += 1000; log(`本能解放：${nm(u)}のLP+1000`); }
  for (const c of U()) {
    if (c.owner !== u.owner && !c.hidden && abU(c, 'petrify') && !isAv(u) && c.x === u.x && c.y + fwd(c.owner) === u.y) addStatus(u, 'petrify');
  }
  checkAuras();
  if (u.dead || G.over) return;
  UI.render();
  if (hasHunting(u) && !assaultOn(u)) await huntLoop(u);
}
async function huntLoop(u) {
  const mv = huntTargets(u);
  if (!mv.length) return;
  const r = await UI.pickBoard({ prompt: 'ハンティング：攻撃するマスを選択（SC' + mv[0].cost + '消費）', cells: mv.map(m => [m.x, m.y]), kind: 'attack', cancellable: true, cancelLabel: 'ハンティングしない' });
  if (!r) return;
  const m = mv.find(m => m.x === r[0][0] && m.y === r[0][1]);
  u.sc -= m.cost;
  const from = { x: u.x, y: u.y };
  await slashTrigger(u);
  if (u.dead || G.over) return;
  const d = enemyAt(m.x, m.y, u.owner);
  if (!d) return;
  const won = await battle(u, d);
  if (u.dead || G.over || !won) return;
  u.x = m.x; u.y = m.y;
  await onEntered(u, from);
}
function checkAuras() {
  for (const d of U()) {
    if (d.dead || d.hidden || !abU(d, 'incinerate')) continue;
    const fx = d.x, fy = d.y + fwd(d.owner);
    const t = enemyAt(fx, fy, d.owner);
    if (t && !isAv(t)) { log(`焼却：${nm(t)}が焼き尽くされた`); killUnit(t); }
    if (wallAt(fx, fy)) { delete G.walls[fx + ',' + fy]; log('焼却：砂壁が破壊された'); }
  }
}

/* ===== バトル ===== */
async function battle(att, def) {
  log(`バトル：${nm(att)}（${coord(att.x, att.y)}）→ ${nm(def)}（${coord(def.x, def.y)}）`);
  UI.render();
  for (const [a, b] of [[att, def], [def, att]]) if (abU(a, 'poisonTouch') && !b.dead) addStatus(b, 'poison');
  if (att.dead) return false;
  if (def.dead) return true;
  if (G.over) return false;
  for (const [a, b] of [[att, def], [def, att]]) {
    if (abU(a, 'slime') && b.weapon) {
      const d = 1 + rnd(6); UI.toast(`🎲 スライムのサイコロ：${d}`);
      if (d >= 4) { G.players[b.owner].grave.push(b.weapon); b.weapon = null; b.armor = 0; b.spc = Math.min(b.spc, baseSpC(b)); log(`${nm(b)}の武器が破壊された`); }
    }
  }
  let forced = null;
  for (const side of [att, def]) { if (await goldenPrompt(side)) { forced = side === att ? 'att' : 'def'; break; } }
  const AV = att.lp + OP(att), DV = def.lp + DP(def);
  let win = false;
  if (forced === 'att') win = true;
  else if (forced === 'def') win = false;
  else if (AV >= DV) win = true;
  else { const dmg = Math.max(0, AV - DP(def)); log(`攻撃値${AV} < 防御値${DV}：${nm(def)}に${dmg}ダメージ`); damage(def, dmg); }
  if (win) { log(`攻撃値${AV}（防御値${DV}）：攻撃側の勝利`); killUnit(def); }
  UI.render();
  return win;
}
/* ゴーレム：魔法耐性・超魔法耐性以外でSpCとして使えるのは1まで */
const spcUsable = u => (golemStep(u) ? Math.min(u.spc, 1) : u.spc);
const canPayAmt = (u, n) => !u.hidden && CARDS[u.cid].spc > 0 && u.st.petrify == null && spcUsable(u) + Math.floor(u.sc / 2) >= n;
async function payCost(p, n) {
  const cands = own(p.i).filter(u => canPayAmt(u, n));
  if (!cands.length) { UI.toast(`SpC${n}を支払えるキャラクター／アバターがいません`); return null; }
  const r = await UI.pickBoard({ who: p.i, prompt: `SpC${n}を消費するキャラクターを選択`, cells: cands.map(c => [c.x, c.y]), kind: 'pay', cancellable: true });
  if (!r) return null;
  const u = at(r[0][0], r[0][1]);
  const use = Math.min(spcUsable(u), n), need = n - use, sc = need * 2;
  if (sc > 0) { if (!(await UI.confirm(`⚠ ${nm(u)}はSpCが${need}足りないため、SCを${sc}消費します。使用しますか？`, p.i))) return null; }
  u.spc -= use; u.sc -= sc;
  return u;
}
async function payTech(p, cands, prompt) {
  const r = await UI.pickBoard({ prompt, cells: cands.map(c => [c.x, c.y]), kind: 'pay', cancellable: true });
  if (!r) return null;
  const u = at(r[0][0], r[0][1]);
  u.sc -= 1;
  return u;
}
async function goldenPrompt(side) {
  if (isAv(side) || side.dead) return false;
  const p = G.players[side.owner];
  if (!p.hand.includes('goldenBody')) return false;
  if (!own(p.i).some(u => canPayAmt(u, 3))) return false;
  const a = await UI.ask(`【${p.name}に確認】${nm(side)}がバトルします。手札の「黄金の体」（SpC3）を使用しますか？`, ['使用する', '使用しない'], side.owner);
  if (a !== '使用する') return false;
  const py = await payCost(p, 3);
  if (!py) return false;
  p.hand.splice(p.hand.indexOf('goldenBody'), 1); p.grave.push('goldenBody');
  await UI.cutIn('goldenBody');
  log(`黄金の体：${nm(side)}は必ず勝利する`);
  await onSpellUsed(p, 'goldenBody');
  return true;
}
const hasResist = u => abU(u, 'magicResist') || abU(u, 'superResist');
async function resist(t, cost, caster, opts = {}) {
  if (!hasResist(t) || t.hidden || t.dead) return false;
  if (!opts.wide && t.owner === caster.i) return false;
  const sup = abU(t, 'superResist');
  const need = sup ? cost : cost + 1;
  const rs = t.uses.sr && t.uses.sr.turn === G.turn ? t.uses.sr.n : 0;
  if (sup && rs >= 2) return false;
  if (t.spc < need || t.st.petrify != null) return false;
  const a = await UI.ask(`【${G.players[t.owner].name}に確認】${nm(t)}の${sup ? '超魔法耐性' : '魔法耐性'}：SpC${need}を支払い、スペルの効果を打ち消しますか？${sup ? `（このターンあと${2 - rs}回）` : ''}`, ['打ち消す', '受ける'], t.owner);
  if (a === '打ち消す') { t.spc -= need; if (sup) t.uses.sr = { turn: G.turn, n: rs + 1 }; log(`${nm(t)}は${sup ? '超魔法耐性' : '魔法耐性'}でスペルを打ち消した`); return true; }
  return false;
}
/* スペル使用の記録と、氷の魔女の誘発 */
async function onSpellUsed(p, cid) {
  p.spellsUsed++;
  const c = CARDS[cid]; let fire = false;
  if (c.rank >= 2) fire = true; else { p.r1Spells++; if (p.r1Spells % 2 === 0) fire = true; }
  if (!fire) return;
  for (const w of chars(p.i).filter(u => abU(u, 'witchChill'))) {
    const es = foes(p).filter(u => !u.dead);
    if (!es.length) break;
    const t = es[rnd(es.length)];
    log(`${nm(w)}：${nm(t)}が「しもやけ」状態になった`);
    addStatus(t, 'chill');
  }
}
function dwarfRedirect(t, user) {
  if (t.owner === user.i) return t;
  const d = own(t.owner).find(u => abU(u, 'dwarf') && !u.hidden && u !== t && !u.uses.dwarf);
  if (!d) return t;
  d.uses.dwarf = true; log(`庇護：対象が${nm(d)}に変更された`); UI.toast('庇護：対象がドワーフの戦士に変更された');
  return d;
}

/* ===== 配置 ===== */
const goblinCount = p => p.deckList.filter(c => CARDS[c].race === 'ゴブリン').length;
const wildCount = p => p.deckList.filter(c => CARDS[c].race === 'ワイルド' && CARDS[c].kind === 'char').length;
function slotKind(p, c) {
  if (p.goblinSlots > 0 && c.race === 'ゴブリン' && c.rank === 1) return 'goblin';

async function playHand(idx) {

    const A = ACT[cid], why = A.can && A.can(p);

    let r = false;
    try { r = await A.run(p, cid); } catch (e) { console.error(e); }
    if (r === false) p.hand.splice(Math.min(idx, p.hand.length), 0, cid);

const instinctActive = p => !!p.instinct && (p.instinct.perm || p.count <= p.instinct.until);
async function startTurn(i) {

  for (const u of own(i)) u.acted = 0;
  G.phase = 'start'; UI.render();
  await UI.turnOverlay(p);
  draw(p, 1); log(`--- ${p.name}のターン${p.count} ---`);
  G.phase = 'draw'; UI.render();
  for (const u of own(i).filter(u => u.hidden && p.count >= u.hiddenSince + 3)) {
    const a = await UI.ask(`${p.name}：潜伏中の${nm(u)}を公開しますか？`, ['公開する', 'まだ公開しない']);
    if (a === '公開する') { u.hidden = false; log(`${nm(u)}が姿を現した`); }
  }
  G.phase = 'main'; afterAction();
}
async function endTurn() {
  const p = cur();
  if (G.over) return false;
  const forced = own(p.i).filter(mustMove);
  if (forced.length) { UI.toast(`必ず移動しなければならないキャラクターがいます：${forced.map(nm).join('、')}`); return false; }
  const c = p.count;
  for (const k of Object.keys(G.walls)) if (G.walls[k].owner === p.i && c >= G.walls[k].expire) { delete G.walls[k]; log('砂壁が崩れた'); }
  for (const u of U()) {
    u.buffs = u.buffs.filter(b => { if (b.who === p.i && G.players[b.who].count >= b.until) { if (b.k === 'lp') u.lp = Math.max(1, u.lp - b.amt); return false; } return true; });
    if (u.owner === p.i) {
      u.attach = u.attach.filter(a => { if (a.until !== undefined && c >= a.until) { p.grave.push(a.cid); return false; } return true; });
      if (u.st.petrify != null && c >= u.st.petrify) delete u.st.petrify;
    }
  }
  if (p.instinct && !p.instinct.perm && c >= p.instinct.until) p.instinct = null;
  for (const u of own(p.i)) {
    u.tArmor = 0;
    const b = baseLP(u); if (u.lp < b) u.lp = b;
    const home = terr(u) !== 'enemy';
    u.sc = Math.max(u.sc, Math.min(baseSC(u), u.sc + (home ? 2 : 1)));
    u.spc = Math.max(u.spc, Math.min(baseSpC(u), u.spc + (home ? 1 : 0)));
  }
  await startTurn(1 - p.i);
  return true;
}

    case 'play': await playHand(ev.i); break;
    case 'move': { const u = G.units[ev.uid]; const mv = u && movesFor(u).find(m => m.x === ev.x && m.y === ev.y); if (mv) await doMove(u, mv); break; }

    case 'moon': { const u = G.units[ev.uid]; if (u) await moonReset(u); break; }
    case 'toAction': if (G.phase === 'main') G.phase = 'action'; break;

  if (!G || G.over) return;

  if (UI.busy || UI.pk || ONL.pending || G.active !== ONL.me) return;
  ONL.pending = true; UI.sel = null; UI.selHand = null;

}

   ・ホストが6桁の部屋番号を発行（PeerJSのIDは "taisen-bg-" + 部屋番号）
   ・ゲストがその番号を入力して接続（ブラウザ同士が直接つながる。最初の接続の取り次ぎだけ PeerJS の公開ブローカーを使う）
   ・全ての操作を「連番つきイベント」として互いに送り、両方のブラウザが同じ乱数の種で同じ順に再生するため、盤面は常に一致する */

    let i = 0;
    const next = () => {
      if (window.Peer) return res();
      if (i >= urls.length) return rej(new Error('PeerJSを読み込めませんでした'));
      const s = document.createElement('script'); s.src = urls[i++]; s.onload = () => (window.Peer ? res() : next()); s.onerror = next; document.head.appendChild(s);

    p.on('open', () => { opened = true; PEER = p; res(p); });
    p.on('error', e => { if (!opened) { try { p.destroy(); } catch (_) { } rej(e); } else UI.toast('通信エラー：' + (e.type || e.message)); });

function take() { return new Promise(res => { if (ONL.queue.length) res(ONL.queue.shift()); else ONL.waiters.push(res); }); }
function flushEv(o) { while (o.buf[o.recv + 1] !== undefined) { const e = o.buf[o.recv + 1]; delete o.buf[o.recv + 1]; o.recv++; pushEv(e); } }
function netEv(n, ev) { const o = ONL; if (!o) { EARLY[n] = ev; return; } if (n <= o.recv) return; o.buf[n] = ev; flushEv(o); }
async function writeEv(ev) {
  if (!CONN || !CONN.open) throw new Error('相手と接続されていません');
  const n = ONL.recv + 1; netSend({ k: 'ev', n, ev }); netEv(n, ev);
}
async function onlineInput(kind, who, localFn) {
  if (ONL.queue.length && ONL.queue[0].t === kind) return (await take()).v;
  if (who === ONL.me) {
    const v = await localFn();
    await writeEv({ t: kind, v: v === undefined ? null : v });
    return (await take()).v;
  }
  UI.wait = `${G.players[who].name}の入力を待っています…`; renderBattle();
  const ev = await take();
  UI.wait = null;
  return ev.v;
}
async function runLoop() {
  const me = ONL;
  while (ONL === me && !me.stop) {
    const ev = await take();
    if (ONL !== me || me.stop) break;
    me.pending = false; UI.busy = true; UI.wait = null;
    try { await execEv(ev); } catch (e) { console.error(e); UI.toast('エラー：' + e.message); }
    if (ONL !== me) break;
    UI.busy = false;
    if (G) afterAction();
  }
}

/* --- 接続の管理 --- */
function setupConn(conn) {
  conn.on('data', onNet);
  conn.on('close', () => onNetClose(conn));
  conn.on('error', () => onNetClose(conn));
}
function onNetClose(conn) {
  if (CONN !== conn) return;
  CONN = null;
  if (ONL && !ONL.stop) {
    if (!G || !G.over) { UI.wait = '相手との接続が切れました。もう一度対戦するには「部屋を出る」から入り直してください。'; UI.toast('相手との接続が切れました'); if (screen === 'battle') renderBattle(); }
  } else if (LOB && LOB.role === 'host' && LOB.room) {
    LOB.room.guest = false; LOB.room.guestReady = false; LOB.starting = false; if (screen === 'prep') renderPrep();
  } else if (LOB && LOB.role === 'guest') { lobErr('部屋の主との接続が切れました。'); LOB = null; renderPrep(); }
}
function onNet(m) {
  if (!m) return;
  if (m.k === 'ev') return netEv(m.n, m.ev);
  if (m.k === 'room' && LOB && LOB.role === 'guest') { LOB.room = m.room; onRoomChange(); return; }
  if (m.k === 'patch' && LOB && LOB.role === 'host') { LOB.room = Object.assign(LOB.room || {}, m.patch); netSend({ k: 'room', room: LOB.room }); onRoomChange(); return; }
  if (m.k === 'hello' && LOB && LOB.role === 'host' && LOB.room) { LOB.room.guest = true; netSend({ k: 'room', room: LOB.room }); if (screen === 'prep') renderPrep(); return; }
  if (m.k === 'full') { lobErr('その部屋はすでに満員です。'); closeNet(); LOB = null; renderPrep(); }
}
function roomUpdate(patch) {
  const L = LOB; if (!L) return;
  if (L.role === 'host') { L.room = Object.assign(L.room || {}, patch); netSend({ k: 'room', room: L.room }); onRoomChange(); }
  else netSend({ k: 'patch', patch });
}
function leaveOnline() {
  if (ONL) { ONL.stop = true; ONL = null; }
  closeNet(); LOB = null;
}

/* ---------- オンライン：部屋（ロビー） ---------- */
async function createRoom() {
  LOBERR = ''; closeNet();
  try { await loadPeerJS(); } catch (e) { return lobErr('通信ライブラリ（PeerJS）を読み込めませんでした。ネット接続を確認してください。'); }
  try {
    let ok = false;
    for (let k = 0; k < 8 && !ok; k++) {
      const code = String(100000 + Math.floor(Math.random() * 900000));
      try { await openPeer(PEER_PREFIX + code); ok = code; } catch (e) { if (e && e.type === 'unavailable-id') continue; throw e; }
    }
    if (!ok) return lobErr('部屋番号の確保に失敗しました。もう一度お試しください。');
    PEER.on('connection', conn => {
      if (CONN && CONN.open) { conn.on('open', () => { try { conn.send({ k: 'full' }); } catch (e) { } setTimeout(() => conn.close(), 400); }); return; }
      CONN = conn; setupConn(conn);
      const onOpen = () => { if (LOB && LOB.room) { LOB.room.guest = true; LOB.room.guestReady = false; netSend({ k: 'room', room: LOB.room }); if (screen === 'prep') renderPrep(); } };
      if (conn.open) onOpen(); else conn.on('open', onOpen);
    });
    enterLobby(ok, 'host');
  } catch (e) { lobErr('部屋を作れませんでした（' + ((e && (e.type || e.message)) || '不明') + '）。'); }
}
async function joinRoom(code) {
  LOBERR = ''; code = String(code).trim();
  if (!/^\d{6}$/.test(code)) return lobErr('6桁の部屋番号を入力してください。');
  closeNet();
  try { await loadPeerJS(); } catch (e) { return lobErr('通信ライブラリ（PeerJS）を読み込めませんでした。ネット接続を確認してください。'); }
  try {
    await openPeer(null);
    await new Promise((res, rej) => {
      const conn = PEER.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
      const to = setTimeout(() => rej({ type: 'timeout' }), 15000);
      PEER.once('error', e => { clearTimeout(to); rej(e); });
      CONN = conn; setupConn(conn);
      conn.on('open', () => { clearTimeout(to); netSend({ k: 'hello' }); res(); });
    });
    enterLobby(code, 'guest');
  } catch (e) {
    closeNet();
    lobErr(e && e.type === 'peer-unavailable' ? 'その番号の部屋はありません。' : e && e.type === 'timeout' ? '接続できませんでした（時間切れ）。番号と、相手がまだ部屋を開いているかを確認してください。' : '入室できませんでした（' + ((e && (e.type || e.message)) || '不明') + '）。');
  }
}
function enterLobby(code, role) {
  LOB = { code, role, room: role === 'host' ? { created: Date.now(), guest: false, status: 'lobby', hostReady: false, guestReady: false } : null, deckId: PREP.a, starting: false, started: null };
  screen = 'prep'; show();
}
function leaveLobby() { if (ONL) return; closeNet(); LOB = null; renderPrep(); }
function onRoomChange() {
  const L = LOB, r = L && L.room; if (!r) { if (screen === 'prep') renderPrep(); return; }
  if (r.status === 'playing' && !ONL && L.started !== r.seed) { L.started = r.seed; startOnline(); return; }
  if (L.role === 'host' && r.status === 'lobby' && r.hostReady && r.guestReady && r.guest && !L.starting) {
    L.starting = true;
    roomUpdate({ status: 'playing', seed: 1 + Math.floor(Math.random() * 2147483000), seat0: Math.random() < .5 ? 'host' : 'guest' });
    return;
  }
  if (screen === 'prep' && !ONL) renderPrep();
}
async function lobReady() {
  const L = LOB; if (!L || !L.room) return;
  const r = L.room, role = L.role, key = role + 'Ready';
  if (r[key]) { roomUpdate({ [key]: false }); return; }
  const d = allDecks().find(d => d.id === L.deckId), v = validateDeck(d.list);
  if (v.err.length) return UI.toast('構築ルール違反のデッキでは対戦できません');
  const ids = Object.keys(d.list).sort().flatMap(k => Array(d.list[k]).fill(k));
  roomUpdate({ [role + 'Deck']: ids, [role + 'DeckName']: d.name, [key]: true });
}
const pubInfo = ids => { const m = {}; for (const id of ids || []) if (CARDS[id] && CARDS[id].rank >= 2 && CARDS[id].kind !== 'char') m[id] = (m[id] || 0) + 1; return Object.entries(m).map(([id, n]) => `${esc(CARDS[id].name)}${n > 1 ? '×' + n : ''}（R${CARDS[id].rank}）`).join('、') || 'なし'; };
function lobbyHTML() {
  if (!LOB) return `<h3 style="margin-top:22px">オンライン対戦</h3><div class="panel"><p class="note">「部屋をつくる」で表示される6桁の番号を相手に伝え、相手が同じ番号を入力して入室します。入室後に各自がデッキを選び、双方が「対戦可能」を押すと始まります。先行・後攻はランダムです。<br>※ 相手と同じページ（同じURL）を開いてください。通信はブラウザ同士の直接接続（P2P）で、サーバーは要りません。</p><div class="bar"><button class="btn main" data-act="mkRoom">部屋をつくる</button><span class="note">または</span><input type="text" id="roomcode" inputmode="numeric" maxlength="6" placeholder="部屋番号（6桁）" style="width:150px"><button class="btn" data-act="joinRoom">入室</button></div>${LOBERR ? `<div class="err">${esc(LOBERR)}</div>` : ''}</div>`;
  const r = LOB.room || {}, role = LOB.role, opp = role === 'host' ? 'guest' : 'host';
  const d = allDecks().find(d => d.id === LOB.deckId) || allDecks()[0], v = validateDeck(d.list), ready = !!r[role + 'Ready'];
  const myIds = Object.keys(d.list).flatMap(k => Array(d.list[k]).fill(k));
  const starting = r.status === 'playing';
  return `<h3 style="margin-top:22px">オンライン対戦　<span class="badge serif">部屋番号 ${esc(LOB.code)}</span></h3><div class="mrow">
  <div class="panel" style="min-width:300px"><b>あなた（${role === 'host' ? '部屋の主' : '入室者'}）</b><br><select data-sel="lob.deck" ${ready ? 'disabled' : ''}>${allDecks().map(x => `<option value="${x.id}" ${x.id === LOB.deckId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
  <div class="note">${deckSize(d.list)}枚　R1:${v.r[0]} R2:${v.r[1]} R3:${v.r[2]}</div>${v.err.map(e => `<div class="err">✖ ${esc(e)}</div>`).join('')}
  <div class="note">相手に公開される情報（キャラ以外のランク2以上）：${pubInfo(myIds)}</div>
  <div class="bar"><button class="btn ${ready ? '' : 'main'}" data-act="lobReady" ${starting || (!ready && v.err.length) ? 'disabled' : ''}>${ready ? '✔ 対戦可能（クリックで取り消し）' : '対戦可能'}</button></div></div>
  <div class="panel" style="min-width:300px"><b>相手</b><br>${r[opp] ? (r[opp + 'Ready'] ? `<span class="ok">✔ 対戦可能</span><div class="note">デッキ：${esc(r[opp + 'DeckName'] || '')}</div><div class="note">公開情報（キャラ以外のランク2以上）：${pubInfo(r[opp + 'Deck'])}</div>` : '<span class="warn">入室済み・デッキ選択中…</span>') : '<span class="note">相手の入室を待っています…</span>'}</div></div>
  <p class="note">${starting ? '対戦を開始します…' : '双方が「対戦可能」を押すと、先行・後攻がランダムに決まって開始します。'}</p><div class="bar"><button class="btn danger" data-act="leaveRoom" ${starting ? 'disabled' : ''}>部屋を出る</button></div>`;
}

async function startOnline() {
  const L = LOB, r = L.room;
  const seat = r.seat0 === L.role ? 0 : 1;
  const d0 = r.seat0 === 'host' ? r.hostDeck : r.guestDeck, d1 = r.seat0 === 'host' ? r.guestDeck : r.hostDeck;
  const me = { code: L.code, me: seat, queue: [], waiters: [], recv: 0, buf: Object.assign({}, EARLY), pending: false, stop: false, seed: r.seed, got: true };
  EARLY = {};
  ONL = me;
  seedRng(r.seed);
  UI.pk = null; UI.sel = null; UI.selHand = null; UI.busy = true; UI.wait = null; UI.overShown = false;
  newGame(d0.slice(), d1.slice());
  screen = 'battle'; show();
  UI.toast(`あなたは${seat === 0 ? '先行' : '後攻'}です`);
  await startTurn(0);
  UI.busy = false;
  flushEv(me);
  runLoop();
}

/* ---------- イベント ---------- */
let lpTimer = null, lpFired = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-card]'); if (!el) return;
  lpFired = false; clearTimeout(lpTimer);
  lpTimer = setTimeout(() => { lpFired = true; showDetail(el.dataset.card, el.dataset.uid); }, 500);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => clearTimeout(lpTimer)));
document.addEventListener('scroll', () => clearTimeout(lpTimer), true);
document.addEventListener('contextmenu', e => { const el = e.target.closest('[data-card]'); if (el) { e.preventDefault(); lpFired = false; showDetail(el.dataset.card, el.dataset.uid); } });
document.addEventListener('click', onClick);
document.addEventListener('change', e => {
  const s = e.target.dataset.sel; if (!s) return;
  const v = e.target.value;
  if (s === 'loadDeck') { if (v) { loadDeck(v); renderBuilder(); } return; }
  if (s === 'prep.a') { PREP.a = v; renderPrep(); return; }
  if (s === 'prep.b') { PREP.b = v; renderPrep(); return; }
  if (s === 'lob.deck') { if (LOB) { LOB.deckId = v; renderPrep(); } return; }
  const [sc, k] = s.split('.');
  if (sc === 'F') { F[k] = v; renderCards(); } else { B.F[k] = v; renderBuilder(); }
});
document.addEventListener('input', e => {
  const s = e.target.dataset.in;
  if (s === 'F.q') { F.q = e.target.value; fillGrid(); }
  else if (s === 'BF.q') { B.F.q = e.target.value; fillPool(); }
  else if (e.target.id === 'dname') B.name = e.target.value;
});
document.querySelectorAll('nav button').forEach(b => b.dataset.act = 'nav');
show();
</script>
